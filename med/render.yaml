services:
  - type: web
    name: med-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: med-database
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: med-database
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: med-database
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_OPTS
        value: "-Xmx400m -Xms200m"

databases:
  - name: med-database
    plan: free
    databaseName: med_db
    user: med_user
