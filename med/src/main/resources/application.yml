server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/med_db
    username: postgres
    password: 12345678

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # Configuration upload de fichiers
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Définit le préfixe de toutes les routes générées par Data REST
  data:
    rest:
      base-path: /api

# Configuration personnalisée pour l'upload
app:
  upload:
    dir: uploads/images

