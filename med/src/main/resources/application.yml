server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/med_db
    username: postgres
    password: 12345678

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true

  # Configuration upload de fichiers
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Définit le préfixe de toutes les routes générées par Data REST
  data:
    rest:
      base-path: /api

# Configuration personnalisée pour l'upload
app:
  upload:
    dir: uploads/images

# Configuration JWT
jwt:
  secret: "MED-Application-Secret-Key-For-JWT-Token-Generation-2024-Must-Be-At-Least-256-Bits-Long"
  expiration: 86400000      # 24h pour clients/societes
  admin-expiration: 28800000 # 8h pour admin

